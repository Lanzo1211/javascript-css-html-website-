<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lanzo.com</title>
<link rel="stylesheet" href="style2.css" >
</head>
<body>
    <header>
        <nav class="navigation">
         <ul>
            <li class="logo">Lanzo.com</li>
        <li class="menu-button" onclick=showSidebar()><a href="#"><ion-icon name="menu-outline" style="font-size: 40px;"></ion-icon></a></li>    
        <li class="hideOnmobile"><a href="#">Home</a></li>
        <li class="hideOnmobile"><a href="#">About</a></li>
        <li class="hideOnmobile"><a href="#">Service</a></li>
        <li class="hideOnmobile" ><a href="#">Contact</a></li>
        <li class="hideOnmobile"><button class="button">Login</button></li>
        
        </ul> 
        <ol class="sidebar">
         <li onclick= hideSidebar()><a href="#"><span class="icon-closeB"><ion-icon name="close"></ion-icon></a></li>
         <li><a href="#">Home</a></li>
         <li><a href="#">About</a></li>
         <li><a href="#">Service</a></li>
         <li><a href="#">Contact</a></li>
         <li><button class="buttonL">Login</button></li>
        </ol>
        </nav>
    </header>

    <div class="wrapper active-popup">
        <span class="icon-close"><ion-icon name="close"></ion-icon>
        </span>
     <div class="form-box login ">
        <h2>Login</h2>
        <form action ="#">
            <div class="input-box">
                <span class="icon">
                <ion-icon name="mail"></ion-icon></span>
                <input type="email" placeholder="" required>
            <label>Email</label>
            </div>
             <div class="input-box">
                <span class="icon">
                <ion-icon name="lock-closed"></ion-icon></span>
                <input type="password" placeholder="" required>
                <label>Password</label>
            </div>
            <div class="remember-forgot">
                <label ><input type="checkbox">Remember me</label>
                <a href="#" class="passwordd">Forget Password</a>
            </div>
            <button type="submit" class="btn">Login</button>
            <div class = "login-register">
                <p>Dont have an account?
                    <a href="#" class="register-link">Register</a></p>
            </div>
        </form>
    </div>
     <div class="form-box register">
        <h2>Registration</h2>
        <form action ="#"><div class="input-box">
                <span class="icon">
                <ion-icon name="person"></ion-icon></span>
                <input type="text" placeholder="" required>
            <label>Username</label>
            </div>
            <div class="input-box">
                <span class="icon">
                <ion-icon name="mail"></ion-icon></span>
                <input type="email" placeholder="" required>
            <label>Email</label>
            </div>
             <div class="input-box">
                <span class="icon">
                <ion-icon name="lock-closed"></ion-icon></span>
                <input type="password" placeholder="" required>
                <label>Password</label>
            </div>
            <div class="remember-forgot">
                <label ><input type="checkbox">i agree to the terms & conditions</label>
                
            </div>
            <button type="submit" class="btn">Register</button>
            <div class = "login-register">
                <p>Already have an account?
                    <a href="#" class="login-link">Login</a></p>
            </div>
        </form>
    </div>
    </div>
<div class= "spot-light"></div>
 <video  autoplay loop muted playsinline class="background-clip">
        <source src="room-at-the-edge.1920x1080(1).mp4" type="video/mp4">
 </video>

</body>
</html>
